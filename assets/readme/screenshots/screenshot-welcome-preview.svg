<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Museum of Dead Dreams asset</title>
  <desc id="desc">Generated repository asset for README visuals.</desc>
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06070d"/>
      <stop offset="48%" stop-color="#130d1f"/>
      <stop offset="100%" stop-color="#180b12"/>
    </linearGradient>
    <linearGradient id="cardGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    
  </defs>
  <rect width="1600" height="900" fill="url(#bgGradient)"/>
  <circle cx="1360" cy="150" r="180" fill="#8b5cf6" opacity="0.12" filter="url(#softGlow)"/>
  <circle cx="200" cy="760" r="160" fill="#ef4444" opacity="0.1" filter="url(#softGlow)"/>
  <circle cx="880.0000000000001" cy="702" r="220" fill="#7dd3fc" opacity="0.08" filter="url(#softGlow)"/>
  <g opacity="0.12">
    <path d="M0 800 H1600" stroke="#ffffff" stroke-width="1"/>
    <path d="M0 840 H1600" stroke="#ffffff" stroke-width="1"/>
  </g>
  
    <text x="76" y="86" fill="#f8fafc" font-family="Cinzel, Georgia, serif" font-size="48" font-weight="700">UI Preview - Welcome Screen</text>
    <rect x="70" y="130" width="1460" height="700" rx="40" fill="url(#cardGradient)" stroke="rgba(255,255,255,0.1)"/>
    <text x="120" y="240" fill="#f8fafc" font-family="Cinzel, Georgia, serif" font-size="78" font-weight="700">Museum of Dead Dreams</text>
    <text x="120" y="294" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="24">Every developer has a graveyard. Let's find yours.</text>
    <rect x="120" y="390" width="720" height="86" rx="28" fill="#0a1020" stroke="rgba(255,255,255,0.1)"/>
    <text x="154" y="444" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="24">github username</text>
    <rect x="870" y="390" width="250" height="86" rx="28" fill="#ef4444" opacity="0.18" stroke="#ef4444" stroke-opacity="0.45"/>
    <text x="932" y="444" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Enter Museum</text>
    
    <g transform="translate(122 154)">
      <rect width="412" height="34" rx="17" fill="#7dd3fc" opacity="0.16" stroke="#7dd3fc" stroke-opacity="0.45"/>
      <text x="206" y="22" text-anchor="middle" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="3">GITHUB GRAVEYARD GENERATOR</text>
    </g>
  
    
    <g transform="translate(1160 356)">
      <rect width="280" height="220" rx="24" fill="#0d1322" stroke="#8b5cf6" stroke-opacity="0.28"/>
      <text x="24" y="38" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">What the curator does</text>
      <text x="24" y="72" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="16">1. Fetches public repos</text><text x="24" y="100" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="16">2. Ranks abandoned work</text><text x="24" y="128" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="16">3. Generates exhibits</text><text x="24" y="156" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="16">4. Produces revival plans</text>
    </g>
  
  
</svg>